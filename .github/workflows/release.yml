name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RESOURCE_NAME: vanta_director_free

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and package resource
        run: |
          npm run format:check
          npm run check
          npm test
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESOURCE_NAME }}
          path: dist/*_EN_Install.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*_EN_Install.zip
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
