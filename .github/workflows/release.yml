name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RESOURCE_NAME: vanta_director_free

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package resource
        run: |
          mkdir -p "dist/$RESOURCE_NAME"
          git archive --format=tar HEAD \
            ':!.github' ':!.gitignore' \
            | tar -x -C "dist/$RESOURCE_NAME"
          cd dist
          zip -r "$RESOURCE_NAME.zip" "$RESOURCE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESOURCE_NAME }}
          path: dist/${{ env.RESOURCE_NAME }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.RESOURCE_NAME }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
